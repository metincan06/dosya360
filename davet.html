<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dosya360 — Davet Kabul</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0B1629;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1A2B47;border-radius:5px;padding:36px;width:100%;max-width:420px;border:0.5px solid rgba(201,168,76,0.2)}
.logo{text-align:center;font-size:22px;font-weight:600;color:#C9A84C;margin-bottom:6px}
.logo-sub{text-align:center;font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:28px}
.title{font-size:18px;font-weight:600;color:#fff;margin-bottom:6px}
.sub{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:24px;line-height:1.6}
.field{margin-bottom:14px}
.field label{font-size:12px;color:rgba(255,255,255,0.5);display:block;margin-bottom:5px}
.field input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.15);border-radius:5px;color:#fff;font-size:13px;outline:none;font-family:inherit}
.field input:focus{border-color:rgba(201,168,76,0.5)}
.btn{width:100%;padding:12px;background:#C9A84C;color:#0B1629;border:none;border-radius:5px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.error{background:rgba(239,68,68,0.15);border:0.5px solid rgba(239,68,68,0.3);border-radius:5px;padding:10px;font-size:12px;color:#FCA5A5;margin-bottom:14px;display:none}
.success{text-align:center;padding:20px 0}
.success-icon{font-size:48px;margin-bottom:14px}
.success-title{font-size:18px;font-weight:600;color:#fff;margin-bottom:8px}
.success-sub{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:20px}

/* ── Tipografi ve yuzey rafinasyonu ─────────────────────── */
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-feature-settings:'cv02','cv03','cv04','tnum';
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.006em;
}
h1,h2,h3,h4,.card-title,.section-title{letter-spacing:-0.018em}
/* Sayilar hizali dizilsin */
.mc-val,.stat-num,.plan-price,.hw-stat-val,.mini-stat-val,td{font-variant-numeric:tabular-nums}
/* Kenarliklar tek tonda */
:root{--border:#E4E7EC;--hairline:#F0F1F3}
table td{border-bottom:1px solid var(--hairline)}
/* Odak halkasi - erisilebilirlik */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid #C9A84C;outline-offset:1px;border-radius:3px
}
/* Gecisler tek egride */
.navitem,.btn,.tbtn,button,.plan-card,.feat-card{transition:background-color .12s ease,border-color .12s ease,color .12s ease}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l3 6a3 3 0 0 1-6 0z"/></svg> Dosya360</div>
  <div class="logo-sub">Avukatlık Bürosu Yönetim Sistemi</div>
  <div id="main-content">
    <div class="title">Davet Aldınız</div>
    <div class="sub" id="davet-sub">Büronuza katılmak için şifrenizi oluşturun.</div>
    <div class="error" id="error-box"></div>
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="davet-email" readonly style="opacity:0.6">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="davet-sifre" placeholder="En az 6 karakter">
    </div>
    <div class="field">
      <label>Şifre Tekrar</label>
      <input type="password" id="davet-sifre2" placeholder="Şifreyi tekrar girin" onkeydown="if(event.key==='Enter')davetKabul()">
    </div>
    <button class="btn" id="davet-kabul-btn" onclick="davetKabul()">Hesap Oluştur & Katıl</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gzyqwbvvorgepazjpkjt.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6eXF3YnZ2b3JnZXBhempwa2p0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjgwNjgsImV4cCI6MjA5OTk0NDA2OH0.H1aVkbCLciXCGbkvsG0jPmYkm5IBXhwstwVkM490-gI'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const params = new URLSearchParams(window.location.search)
const token = params.get('token')
let davetBilgi = null

async function init() {
  if (!token) { showError('Geçersiz davet linki.'); return }
  const { data, error } = await sb.from('davetler').select('*').eq('token', token).single()
  if (error || !data) { showError('Bu davet linki geçersiz veya süresi dolmuş.'); return }
  if (data.durum !== 'bekliyor') { showError('Bu davet linki daha önce kullanılmış.'); return }
  if (new Date(data.expires_at) < new Date()) { showError('Bu davet linkinin süresi dolmuş.'); return }
  davetBilgi = data
  document.getElementById('davet-email').value = data.email
  document.getElementById('davet-sub').textContent = `${data.email} adresi için davet alındı. Şifrenizi oluşturarak büronuza katılın.`
}

async function davetKabul() {
  const sifre = document.getElementById('davet-sifre').value
  const sifre2 = document.getElementById('davet-sifre2').value
  if (sifre !== sifre2) { showError('Şifreler uyuşmuyor!'); return }
  if (sifre.length < 6) { showError('Şifre en az 6 karakter olmalı!'); return }

  const btn = document.getElementById('davet-kabul-btn')
  btn.disabled = true; btn.textContent = 'Hesap oluşturuluyor...'

  try {
    const { data, error } = await sb.auth.signUp({ email: davetBilgi.email, password: sifre })
    if (error && !String(error.message).includes('already registered')) throw error

    // Oturumu kesinlestir - signUp her zaman oturum acmayabiliyor
    let { data: oturum } = await sb.auth.getSession()
    if (!oturum?.session) {
      const { error: gErr } = await sb.auth.signInWithPassword({ email: davetBilgi.email, password: sifre })
      if (gErr) throw new Error('Hesap olusturuldu ancak giris yapilamadi. Sifrenizle giris yapmayi deneyin.')
    }

    // Buroya katilim - sunucu tarafinda atomik
    const { data: sonuc, error: rErr } = await sb.rpc('daveti_kabul_et', { p_token: token })
    if (rErr) throw rErr
    if (!sonuc || sonuc.ok !== true) throw new Error(sonuc?.hata || 'Buroya katilim tamamlanamadi')

    document.getElementById('main-content').innerHTML = `
      <div class="success">
        <div class="success-icon"><i class="ti ti-circle-check" style="color:#C9A84C"></i></div>
        <div class="success-title">Hoş Geldiniz!</div>
        <div class="success-sub">Hesabınız oluşturuldu. Şimdi sisteme giriş yapabilirsiniz.</div>
        <button class="btn" onclick="window.location.href='uygulama.html'">Uygulamaya Git →</button>
      </div>`
  } catch(err) {
    let msg = err.message
    if (msg.includes('already registered')) msg = 'Bu e-posta zaten kayıtlı. Giriş yapın.'
    showError(msg)
    btn.disabled = false; btn.textContent = 'Hesap Oluştur & Katıl'
  }
}

function showError(msg) {
  const el = document.getElementById('error-box')
  if (el) { el.textContent = msg; el.style.display = 'block' }
  else { document.querySelector('.card').innerHTML = `<div style="text-align:center;color:#FCA5A5;padding:20px">${msg}</div>` }
}

init()
</script>
</body>
</html>
