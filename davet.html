<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dosya360 — Davet Kabul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --mavi:#1B4FA8; --mavi-ac:#2E6FD4; --mavi-zem:#EDF3FD;
  --derin:#0C1B33;
  --metin:#0F1B2E; --soluk:#53627A; --silik:#8D99AE;
  --kenar:#E3E9F2; --ince:#EFF3F8;
  --yesil:#0C7A52; --yesil-zem:#E8F7F0;
  --kirmizi:#C02626; --kirmizi-zem:#FDEDED;
  --amber:#A96109;
}
h1,h2,h3,h4,.baslik{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.028em;font-weight:700}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     color:var(--metin);min-height:100vh;display:flex;align-items:center;
     justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;letter-spacing:-.009em;
     background:
       radial-gradient(1100px 520px at 50% -14%,rgba(46,111,212,.10),transparent 64%),
       linear-gradient(180deg,#FFFFFF 0%,#F2F6FC 62%,#EAF0F9 100%);
     background-color:#F4F7FC}
:focus-visible{outline:2px solid var(--mavi-ac);outline-offset:2px;border-radius:6px}

.kutu{width:100%;max-width:412px}
.tepe{text-align:center;margin-bottom:30px}
.lg{display:inline-flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;
    font-size:26px;font-weight:800;color:var(--metin);letter-spacing:-.034em}
.lg svg{width:24px;height:24px;color:#A8822E}
.lg-alt{font-size:12.5px;color:#6B7A94;margin-top:7px}

.kart{background:#fff;border-radius:20px;padding:34px 32px;border:1px solid #E6EBF3;
      box-shadow:0 1px 2px rgba(15,27,46,.05),
                 0 10px 24px -12px rgba(15,27,46,.14),
                 0 36px 70px -34px rgba(27,79,168,.3)}
.baslik{font-size:19px;color:var(--metin);margin-bottom:6px;letter-spacing:-.028em}
.aciklama{font-size:13.5px;color:var(--soluk);line-height:1.65;margin-bottom:24px}

.alan{margin-bottom:16px}
.alan label{display:block;font-size:12px;font-weight:600;color:var(--soluk);margin-bottom:7px}
.alan input{width:100%;padding:12px 15px;border:1px solid var(--kenar);border-radius:11px;
            font-size:14.5px;outline:none;font-family:inherit;color:var(--metin);background:#FBFCFE;
            transition:border-color .16s,background .16s,box-shadow .16s}
.alan input::placeholder{color:#A9B5C9}
.alan input:focus{border-color:var(--mavi-ac);background:#fff;
                  box-shadow:0 0 0 3.5px rgba(46,111,212,.14)}

.olcu{height:4px;background:var(--ince);border-radius:99px;margin-top:9px;overflow:hidden}
.olcu i{display:block;height:100%;width:0;border-radius:99px;transition:width .24s,background .24s}
.olcu-yazi{font-size:11.5px;margin-top:6px;color:var(--silik)}

.btn{width:100%;padding:13px;background:var(--mavi);color:#fff;border:none;border-radius:999px;
     font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:-.014em;margin-top:10px;
     box-shadow:0 1px 2px rgba(27,79,168,.2),0 8px 20px -10px rgba(27,79,168,.6);
     transition:background .16s,transform .12s,box-shadow .16s}
.btn:hover{background:#174291;box-shadow:0 2px 5px rgba(27,79,168,.24),0 12px 26px -12px rgba(27,79,168,.65)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

.uyari,.error{border-radius:11px;padding:11px 14px;font-size:13px;margin-bottom:16px;line-height:1.55;display:none}
.uyari.hata,.error{background:var(--kirmizi-zem);border:1px solid #F8D4D4;color:var(--kirmizi)}
.uyari.iyi{background:var(--yesil-zem);border:1px solid #BDE9D6;color:var(--yesil)}

.alt{text-align:center;font-size:13.5px;color:var(--soluk);margin-top:20px}
.alt a{color:var(--mavi);font-weight:600;text-decoration:none}
.alt a:hover{text-decoration:underline}

.bitti{text-align:center;padding:14px 0}
.bitti i{font-size:42px;color:var(--yesil)}
.bitti-a{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;
         margin-top:14px;letter-spacing:-.026em}
.bitti-b{font-size:13.5px;color:var(--soluk);margin-top:7px;line-height:1.65}
.gizle{display:none}

/* davet.html uyumu */
.card{background:#fff;border-radius:20px;padding:34px 32px;width:100%;max-width:412px;
      border:1px solid #E6EBF3;
      box-shadow:0 1px 2px rgba(15,27,46,.05),
                 0 10px 24px -12px rgba(15,27,46,.14),
                 0 36px 70px -34px rgba(27,79,168,.3)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;
      font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:800;
      color:var(--metin);letter-spacing:-.034em;margin-bottom:7px}
.logo svg{color:#A8822E}
.logo-sub{text-align:center;font-size:12.5px;color:#6B7A94;margin-bottom:28px}
.title{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:700;
       color:var(--metin);margin-bottom:6px;letter-spacing:-.028em}
.sub{font-size:13.5px;color:var(--soluk);margin-bottom:24px;line-height:1.65}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--soluk);margin-bottom:7px}
.field input{width:100%;padding:12px 15px;background:#FBFCFE;border:1px solid var(--kenar);
             border-radius:11px;color:var(--metin);font-size:14.5px;outline:none;font-family:inherit;
             transition:border-color .16s,background .16s,box-shadow .16s}
.field input::placeholder{color:#A9B5C9}
.field input:focus{border-color:var(--mavi-ac);background:#fff;
                   box-shadow:0 0 0 3.5px rgba(46,111,212,.14)}
.success{background:var(--yesil-zem);border:1px solid #BDE9D6;border-radius:11px;padding:11px 14px;
         font-size:13px;color:var(--yesil);margin-bottom:16px;line-height:1.55;display:none}
.info{font-size:12.5px;color:var(--silik);text-align:center;margin-top:18px;line-height:1.6}
.loading{text-align:center;padding:30px 0;color:var(--soluk);font-size:13.5px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l3 6a3 3 0 0 1-6 0z"/></svg> Dosya360</div>
  <div class="logo-sub">Avukatlık Bürosu Yönetim Sistemi</div>
  <div id="main-content">
    <div class="title">Davet Aldınız</div>
    <div class="sub" id="davet-sub">Büronuza katılmak için şifrenizi oluşturun.</div>
    <div class="error" id="error-box"></div>
    <div class="field">
      <label>E-posta</label>
      <input type="email" id="davet-email" readonly style="opacity:0.6">
    </div>
    <div class="field">
      <label>Şifre</label>
      <input type="password" id="davet-sifre" placeholder="En az 6 karakter">
    </div>
    <div class="field">
      <label>Şifre Tekrar</label>
      <input type="password" id="davet-sifre2" placeholder="Şifreyi tekrar girin" onkeydown="if(event.key==='Enter')davetKabul()">
    </div>
    <button class="btn" id="davet-kabul-btn" onclick="davetKabul()">Hesap Oluştur & Katıl</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gzyqwbvvorgepazjpkjt.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6eXF3YnZ2b3JnZXBhempwa2p0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjgwNjgsImV4cCI6MjA5OTk0NDA2OH0.H1aVkbCLciXCGbkvsG0jPmYkm5IBXhwstwVkM490-gI'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const params = new URLSearchParams(window.location.search)
const token = params.get('token')
let davetBilgi = null

async function init() {
  if (!token) { showError('Geçersiz davet linki.'); return }

  const { data, error } = await sb.rpc('davet_bilgi', { p_token: token })

  if (error) {
    showError('Davet bilgisi alınamadı. Bağlantınızı kontrol edip sayfayı yenileyin.')
    console.warn('davet_bilgi:', error)
    return
  }
  if (!data || data.ok !== true) {
    const h = data && data.hata
    if (h === 'kullanildi') {
      showError('Bu davet daha önce kullanılmış. Şifrenizle giriş yapmayı deneyin.')
    } else if (h === 'suresi_doldu') {
      showError('Bu davetin süresi dolmuş. Sizi davet eden bürodan yeni bir davet isteyin.')
    } else {
      showError('Bu davet bağlantısı geçersiz. Bağlantının tamamını kopyaladığınızdan emin olun.')
    }
    return
  }

  davetBilgi = { email: data.email, buro_adi: data.buro_adi }
  document.getElementById('davet-email').value = data.email
  document.getElementById('davet-sub').textContent =
    `${data.buro_adi} sizi ekibine davet etti. Şifrenizi oluşturarak katılın.`
}

async function davetKabul() {
  const sifre = document.getElementById('davet-sifre').value
  const sifre2 = document.getElementById('davet-sifre2').value
  if (sifre !== sifre2) { showError('Şifreler uyuşmuyor!'); return }
  if (sifre.length < 6) { showError('Şifre en az 6 karakter olmalı!'); return }

  const btn = document.getElementById('davet-kabul-btn')
  btn.disabled = true; btn.textContent = 'Hesap oluşturuluyor...'

  try {
    const { data, error } = await sb.auth.signUp({ email: davetBilgi.email, password: sifre })
    if (error && !String(error.message).includes('already registered')) throw error

    // Oturumu kesinlestir - signUp her zaman oturum acmayabiliyor
    let { data: oturum } = await sb.auth.getSession()
    if (!oturum?.session) {
      const { error: gErr } = await sb.auth.signInWithPassword({ email: davetBilgi.email, password: sifre })
      if (gErr) throw new Error('Hesap olusturuldu ancak giris yapilamadi. Sifrenizle giris yapmayi deneyin.')
    }

    // Buroya katilim - sunucu tarafinda atomik
    const { data: sonuc, error: rErr } = await sb.rpc('daveti_kabul_et', { p_token: token })
    if (rErr) throw rErr
    if (!sonuc || sonuc.ok !== true) throw new Error(sonuc?.hata || 'Buroya katilim tamamlanamadi')

    document.getElementById('main-content').innerHTML = `
      <div class="success">
        <div class="success-icon"><i class="ti ti-circle-check" style="color:#2E6FD4"></i></div>
        <div class="success-title">Hoş Geldiniz!</div>
        <div class="success-sub">Hesabınız oluşturuldu. Şimdi sisteme giriş yapabilirsiniz.</div>
        <button class="btn" onclick="window.location.href='uygulama.html'">Uygulamaya Git →</button>
      </div>`
  } catch(err) {
    let msg = err.message
    if (msg.includes('already registered')) msg = 'Bu e-posta zaten kayıtlı. Giriş yapın.'
    showError(msg)
    btn.disabled = false; btn.textContent = 'Hesap Oluştur & Katıl'
  }
}

function showError(msg) {
  const el = document.getElementById('error-box')
  if (el) { el.textContent = msg; el.style.display = 'block' }
  else { document.querySelector('.card').innerHTML = `<div style="text-align:center;color:#FCA5A5;padding:20px">${msg}</div>` }
}

init()
</script>
</body>
</html>
